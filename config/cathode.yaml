# Cathode diode — lume-warpx config (WarpX 2D x–z). All constants live here; sim/cathode.py
# reads them back and overrides only runtime-computed values (flux, thermal velocity, dt, the
# diagnostic periods). See docs/cathode.md for physics, parameters, and gotchas. The shipped
# values ARE the single Balanced operating point.

grid:
  grid_type: Cartesian2DGrid
  number_of_cells: [128, 64]           # [nx, nz]
  lower_bound: [-0.016, 0.0]           # [-W, 0]
  upper_bound: [0.016, 200.0e-6]       # [ W, gap_d]
  lower_boundary_conditions: [neumann, dirichlet]   # x insulating; z plates fixed potential
  upper_boundary_conditions: [neumann, dirichlet]
  lower_boundary_conditions_particles: [absorbing, absorbing]
  upper_boundary_conditions_particles: [absorbing, absorbing]
  warpx_potential_lo_z: 0.0            # cathode
  warpx_potential_hi_z: 30.0           # overridden → V(t) grid pulse (peak = V_OFF+V_PULSE)
  warpx_blocking_factor: 8

solver:
  solver_type: ES_MLMG_LF
  required_precision: 3.0e-5            # Balanced operating point
  warpx_self_fields_verbosity: 0

simulation:
  max_steps: 2000
  time_step_size: 1.0e-12              # overridden (dt = CFL·dz/v_final)
  particle_shape: linear
  warpx_random_seed: 1                 # seed WarpX's PIC RNG (the cathode is the only stage that draws
                                       # from it: UniformFlux + PseudoRandom emission + gaussian_flux
                                       # momenta). NOTE: this build's flux-injection draws are not fully
                                       # reset by the seed, so q_emit_C still varies ~0.4% run-to-run —
                                       # the cathode is NOT bit-reproducible; the seed pins what it can.
                                       # Downstream stages re-inject a fixed beam (numpy RNG_SEED only).
                                       # WarpX requires the seed > 0.

species:
  - particle_type: electron
    name: electrons
    distribution-type: UniformFlux
    flux: 1.0e24                        # overridden (over_inject·J_CL/q_e)
    flux_normal_axis: z
    surface_flux_position: 0.0
    flux_direction: 1
    lower_bound: [-0.008, null, null]   # finite cathode patch (±R_cathode)
    upper_bound: [0.008, null, null]
    rms_velocity: [1.0e5, 1.0e5, 1.0e5] # overridden (thermal v_th)
    directed_velocity: [0.0, 0.0, 0.0]
    gaussian_flux_momentum_distribution: true
    warpx_do_not_deposit: false        # KEEP false — space charge is the sole current limiter
    layout: PseudoRandom
    n_macroparticles_per_cell: 6        # Balanced operating point

diagnostics:
  - diagnostic_type: Field
    name: fields
    period: 80                          # overridden (dense-early union slice)
    data_list: [phi, rho, E, J]
    write_dir: logs/diags/cathode       # → logs/diags/cathode/fields
  - diagnostic_type: Particle
    name: particles
    period: 200                         # overridden
    species: [electrons]
    data_list: [position, momentum, weighting]
    write_dir: logs/diags/cathode       # → logs/diags/cathode/particles

# Stage knobs with no WarpX-native home (read by sim/cathode.py).
params:
  T_cathode: 1425.0                    # cathode temperature [K]
  over_inject: 2.0                     # inject this multiple of the peak-voltage Child–Langmuir current
  CFL: 0.4                             # dt = CFL · dz / v_final
  DIAG_PERIOD: null                    # null → uniform pulse-resolving field period; an int → that period
  # Grid voltage pulse V(t) = V_OFF + V_PULSE·tent(t) (LinacSim CESR cathode operating point):
  # a rounded triangle rising/falling at V_SLOPE, peak swing V_PULSE, FWHM ≈ PULSE_WIDTH.
  V_OFF: -30.0                         # off/retarding bias before & after the pulse [V]
  V_PULSE: 60.0                        # peak voltage swing [V] (peak grid bias = V_OFF + V_PULSE)
  V_SLOPE: 30.0e9                      # max pulse slope [V/s] (= 30 V/ns)
  PULSE_WIDTH: 2.0e-9                  # pulse FWHM [s]
  GRID_TRANS: 0.80                     # grid optical transmission (fraction passing the grid mesh)
  R_CATHODE: 0.008                     # emitting disc radius [m] (= half the 16 mm cathode); 2D→disc charge area
  ANODE_FRAC: 0.1                      # handoff slab = top fraction of the gap (z ≥ (1−frac)·gap_d);
                                       # the forward-moving beam crossing the anode that seeds the gun
