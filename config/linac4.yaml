# Cornell Linac Section 4 (CU 5) — lume-warpx config (WarpX RZ, single azimuthal mode). All
# constants live here; sim/linac1-4.py (run as `python sim/linac1-4.py 4`) reads them back,
# imports linac section 3's exit beam via WarpX(initial_particles=...), and overrides only
# runtime-computed values (the two quadrature RF time functions, step count, dt, diagnostic
# period). Geometry/grid are IDENTICAL to sections 1/2/3 (the SAME shared SLAC 3 m maps are
# reused); only the beam energy and the FROZEN RF setpoints differ. Section 4's exit is the
# 4→5 boundary: the input to the e+/e- converter target (sim/converter.py). See docs/linac1-4.md.

grid:
  grid_type: CylindricalGrid
  number_of_cells: [16, 1664]          # [NR, NZ]; keep ≈3:1 cells or MLMG diverges
  n_azimuthal_modes: 1
  lower_bound: [0.0, 0.0]
  upper_bound: [0.009547, 3.50]        # [RMAX (SLAC bore), ZMAX]; field-free drift past the 3.12 m exit
  lower_boundary_conditions: [none, dirichlet]
  upper_boundary_conditions: [neumann, dirichlet]
  lower_boundary_conditions_particles: [none, absorbing]
  upper_boundary_conditions_particles: [absorbing, absorbing]
  warpx_blocking_factor: 8

solver:
  solver_type: ES_MLMG_LF              # space charge is a small perturbation at ~78–122 MeV
  required_precision: 1.0e-4
  maximum_iterations: 200
  warpx_self_fields_verbosity: 0

simulation:
  max_steps: 1000                      # overridden (auto-derived from transit)
  time_step_size: 1.0e-12              # overridden (dt = CFL·Δz/v_inject)
  particle_shape: linear

# The two SLAC quadrature RF maps, summed by WarpX (field2 is the 90° quadrature half). Both
# load E+B; the cos/sin drive strings (amplitude scale + phase) are overridden at runtime. These
# are the SAME shared maps as sections 1, 2 and 3.
fields:
  - {field_type: AppliedFromFile, path: fieldmaps/h5/linac_rf1.h5, load_E: true, load_B: true, warpx_E_time_function: "0.0", warpx_B_time_function: "0.0"}
  - {field_type: AppliedFromFile, path: fieldmaps/h5/linac_rf2.h5, load_E: true, load_B: true, warpx_E_time_function: "0.0", warpx_B_time_function: "0.0"}

species:
  - particle_type: electron
    name: electrons
    distribution-type: FromInitialParticles   # linac section 3 exit beam via initial_particles
    warpx_do_not_deposit: true                # SC off: 1/gamma^2-negligible at >70 MeV (identical beam, ~50x faster); set false for a self-consistent run
    layout: PseudoRandom
    n_macroparticles_per_cell: 1

diagnostics:
  - diagnostic_type: Particle
    name: particles
    period: 100                                # overridden (max_steps // N_DIAGS)
    species: [electrons]
    data_list: [position, momentum, weighting]
    write_dir: logs/diags/linac1-4/sec4/main   # → logs/diags/linac1-4/sec4/main/particles

# Stage knobs with no WarpX-native home (read by sim/linac1-4.py).
params:
  # CREST_PHASE_DEG is re-derived automatically by sim/main.py (it runs `sim/autophase.py 4` before
  # this stage); the value here is the seed used when running the stage standalone. FIELD_SCALE is
  # NOT autophased -- re-fit it to DE_TARGET_MEV (the old per-section ΔE-target loop) when retuning
  # the section-4 (CU 5) operating point; the shipped value is copied from section 3.
  CREST_PHASE_DEG: 178.1528            # autophased by sim/main.py; standalone seed
  FIELD_SCALE: 2.081400e+02            # re-fit to DE_TARGET 51 MeV (ΔE ∝ scale, measured on the chain)
  DE_TARGET_MEV: 51.0                  # Fromowitz ACC_4 design energy gain [MeV] (5.248 m / 149 cells)
  PHASE_DEG: 0.0                       # RF phase DETUNE [deg] from the frozen crest (0 = on-crest)
  F_RF: 2856.0e6                       # SLAC S-band [Hz]
  RF_NORM_MW: 0.001                    # field-map power normalisation (1 kW); report-only here
  CFL: 0.5                             # dt = CFL · Δz / v_inject
  MAX_PART: 50000                      # downsample the imported exit beam (reweighted)
  RESAMPLE_N: 50000                      # >0 → resample beam to EXACTLY N macroparticles (up- or down-sample, reweighted); 0 → off (MAX_PART downsample)
  MAX_STEPS: 0                         # 0 → auto-derive from transit; >0 → fixed
  N_DIAGS: 60
  TRANSIT_MARGIN: 1.0
  Z_INJECT: 0.005                      # lab z of the bunch tail [m]
  RNG_SEED: 0
