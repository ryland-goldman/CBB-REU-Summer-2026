# Xopt CNSGA configuration for the Cornell linac chain. sim/optimize.py reads this.
# Multi-objective: maximize transmitted charge AND minimize transverse emittance (the genuine
# trade pair); energy, energy spread, spot, and core transmission are constraints. All objectives
# read from logs/diags/linac5-8/main/injection_summary.json (extended by sim/linac5-8.py).
xopt:
  max_evaluations: 1792          # 64 CNSGA generations x 28 population
generator:
  # The generator (CNSGAGenerator) and evaluator function are bound in sim/optimize.py:main, not read
  # from here; population_size / executor / max_workers below ARE read.
  population_size: 28            # CNSGA generation size (64 generations x 28 = 1792 evals)
evaluator:
  executor: process              # process (local ProcessPool, one node) | dask-sge: each worker is its
                                 # OWN 1-core qsub job, spread across the cluster -- real N-way parallelism.
  max_workers: 14                # local run on a 14-core / 26 GB Mac: 14 concurrent full-chain evals
                                 # saturate every core (each eval is single-core, OMP=1); peak RAM ~21 GB
                                 # of 26. (dask-sge cluster value was 64; recover via git.)
  # --- dask-sge worker qsub jobs reproduce the cluster env (sim/optimize.make_executor) ---
  env_setup: /nfs/acc/temp/rjg343/Cornell2/cluster_env.sh   # each worker `source`s this: conda + g4bl +
                                                            # Geant4 data + OMP/HDF5 + LINACSIM_RUNS_DIR + PYTHONPATH
  resource_spec: mem_free=8G,os_name=el9   # 8G per worker: gives each chain headroom AND makes SGE pack
                                           # fewer workers/node (memory-bandwidth contention was the killer)
  queue: all.q                             # site queue holding the free slots
  walltime: "47:50:00"                     # worker job h_rt -- UNDER the 48:00:00 cap (else rejected like 120h was)
vocs:
  variables:                     # name: [lo, hi]  -- bounds in physical units
    # --- final-stage beam-quality knobs (highest leverage, cheapest if scope=downstream) ---
    l5_field_scale_0: [2.4e7, 2.9e7]   # linac5-8 sections[0].field_scale  (CEA 4)
    l5_field_scale_1: [2.4e7, 2.9e7]   # sections[1].field_scale           (CEA 5)
    l5_field_scale_2: [2.2e7, 2.7e7]   # sections[2].field_scale           (CU 3)
    l5_field_scale_3: [2.2e7, 2.7e7]   # sections[3].field_scale           (CU 4)
    l5_phase_off_0:   [-30, 30]        # crest OFFSET [deg] on sections[0] (added to autophased crest)
    l5_phase_off_1:   [-30, 30]
    l5_phase_off_2:   [-30, 30]
    l5_phase_off_3:   [-30, 30]
    l5_quad_scale_1:  [0.2, 2.5]       # sections[1].quad_scale (x the sec6 CESR exit-triplet gradients)
    l5_quad_scale_2:  [0.2, 2.5]       # sections[2].quad_scale (x the sec7 CESR exit-triplet gradients)
    # applied sec-5/6 field = this x (conv_sol_b_tesla/0.7022) via solenoid_tracking — range bounds the pre-scale value
    l5_sol_b_5:       [0.05, 0.6]      # sections[0].solenoid_b_tesla (264 A machine flat-top = 0.243 T)
    l5_sol_b_6:       [0.05, 0.6]      # sections[1].solenoid_b_tesla
    # --- converter (positron yield + emittance into linac5-8) ---
    conv_target_len_mm: [4.0, 9.0]     # converter geometry.target_length_mm
    conv_sol_b_tesla:   [0.35, 1.4]    # converter solenoid.b_tesla (con_sol peak; 0.7022 = 3300 A)
    conv_exit_drift_mm: [125, 250]     # converter solenoid.exit_drift_mm (back face -> plane; >121 = past the map)
    # --- capture (linac1) -- auto-dropped unless scope=full (upstream of --from converter) ---
    l1_power_mw:  [14, 24]             # linac1 POWER_MW
    l1_phase_off: [-30, 30]            # crest OFFSET [deg] on linac1 sec-1 (added to autophased PHASE_DEG)
    # --- injector match -- auto-dropped unless scope=full (expensive upstream) ---
    inj_i_sol0:   [20, 60]             # injector I_SOL0
    inj_i_lens0e: [0, 20]             # injector I_LENS0E
    inj_preb1_kw: [4, 14]             # injector PREB1_KW (prebuncher-1 RF power)
    inj_preb2_kw: [4, 16]             # injector PREB2_KW (prebuncher-2 RF power)
    inj_preb1_phi: [-45, 45]          # injector PREB1_PHI_OFF [deg] -- prebuncher-1 cavity phase (bunching)
    inj_preb2_phi: [-45, 45]          # injector PREB2_PHI_OFF [deg] -- prebuncher-2 cavity phase (bunching)
  objectives:
    q_out_C: MAXIMIZE
    eps_n: MINIMIZE
    # Beam quality as objectives, NOT hard constraints: the captured tungsten-converter positron
    # spectrum sits at ~9% rel energy spread and ~8 mm spot even at the ~235 MeV exit, so a <1% / <2 mm
    # cut admits no population member (an empty feasible Pareto front). Trade them on the front instead.
    sigma_E_rel: MINIMIZE
    sigma_x_mm: MINIMIZE
  constraints:
    ke_out_mev:        [GREATER_THAN, 200.0]
    transmission_core: [GREATER_THAN, 0.005]   # linac5-8 internal n_out/n_in (already emitted); the
                                               # q_out_C MAXIMIZE objective already pushes end-to-end charge
run:
  scope: full              # downstream (converter+linac5-8) | full (cathode->linac5-8)
  eval_timeout_s: 5400             # 90 min -- with linac5-8 np=48k a full-chain eval is ~40 min solo,
                                   # ~60-80 min under node memory-bandwidth contention; 1 h timed them out
  keep_failed_sandboxes: false       # local: 51 GB free disk -- don't accumulate failed full-chain sandboxes
  keep_successful_sandboxes: false   # rmtree a successful eval's sandbox after its summary is read
                                     # (each scope=full sandbox holds a full chain's diags -> TB over a run)
