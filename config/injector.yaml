# CESR injector -- lume-warpx config (WarpX RZ, single azimuthal mode). All constants live here;
# sim/injector.py reads them back and overrides only runtime-computed values (the per-field RF/
# solenoid time functions, step count, dt, diagnostic period). The beam is imported from the gun
# handoff via WarpX(initial_particles=...). See docs/injector.md for physics and gotchas.

grid:
  grid_type: CylindricalGrid
  number_of_cells: [80, 1664]          # [NR, NZ]; dz~=1.26 mm => 2.80:1 aspect
  n_azimuthal_modes: 1
  lower_bound: [0.0, 0.0]
  upper_bound: [0.036, 2.10]           # [RMAX, ZMAX]
  # Outer radial wall dirichlet (NOT neumann): the EMS A_z vector-Poisson is else singular.
  lower_boundary_conditions: [none, dirichlet]
  upper_boundary_conditions: [dirichlet, dirichlet]
  lower_boundary_conditions_particles: [none, absorbing]
  upper_boundary_conditions_particles: [absorbing, absorbing]
  warpx_blocking_factor: 8

solver:
  solver_type: ES_MLMG_EMS             # relativistic electromagnetostatic self-field (gamma^2 removed)
  required_precision: 1.0e-3           # Balanced; Conservative 1e-5
  maximum_iterations: 150              # Balanced; Conservative 500 (A_z converges in 3-4 V-cycles)
  warpx_magnetostatic_required_precision: 1.0e-3
  warpx_magnetostatic_max_iters: 150
  warpx_self_fields_verbosity: 0
  warpx_magnetostatic_verbosity: 0

simulation:
  max_steps: 1000                      # overridden (auto-derived from transit)
  time_step_size: 1.0e-12              # overridden (dt = CFL*dz/v_beam)
  particle_shape: linear

# Applied fields, in install order: B-only solenoids FIRST, RF cavities LAST (a cavity, load_E,
# must be last or picmi forces the global E_ext style to "none"). All time functions overridden.
fields:
  - {field_type: AppliedFromFile, path: fieldmaps/h5/lens0a.h5, load_E: false, load_B: true, warpx_B_time_function: "0.0"}  # Lens 0A
  - {field_type: AppliedFromFile, path: fieldmaps/h5/lens0b.h5, load_E: false, load_B: true, warpx_B_time_function: "0.0"}  # Lens 0B
  - {field_type: AppliedFromFile, path: fieldmaps/h5/lens0c.h5, load_E: false, load_B: true, warpx_B_time_function: "0.0"}  # Lens 0C
  - {field_type: AppliedFromFile, path: fieldmaps/h5/lens0d.h5, load_E: false, load_B: true, warpx_B_time_function: "0.0"}  # Lens 0D
  - {field_type: AppliedFromFile, path: fieldmaps/h5/sol0.h5,   load_E: false, load_B: true, warpx_B_time_function: "0.0"}  # Sol 0
  - {field_type: AppliedFromFile, path: fieldmaps/h5/lens0e.h5, load_E: false, load_B: true, warpx_B_time_function: "0.0"}  # Lens 0E
  - {field_type: AppliedFromFile, path: fieldmaps/h5/preb1_EB.h5, load_E: true, load_B: true, warpx_E_time_function: "0.0", warpx_B_time_function: "0.0"}  # Prebuncher 1
  - {field_type: AppliedFromFile, path: fieldmaps/h5/preb2_EB.h5, load_E: true, load_B: true, warpx_E_time_function: "0.0", warpx_B_time_function: "0.0"}  # Prebuncher 2 (reversed)

species:
  - particle_type: electron
    name: electrons
    distribution-type: FromInitialParticles   # gun handoff beam via WarpX(initial_particles=...)
    warpx_do_not_deposit: true                # space charge off
    layout: PseudoRandom
    n_macroparticles_per_cell: 1

diagnostics:
  - diagnostic_type: Particle
    name: particles
    period: 100                                # overridden (lands a dump near the 2.03 m plane)
    species: [electrons]
    data_list: [position, momentum, weighting]
    write_dir: logs/diags/injector/main

# Stage knobs with no WarpX-native home (read by sim/injector.py). Solenoid currents [A] and
# prebuncher powers [kW] are the config-overridable operating point; 0 A/kW => no field.
params:
  CFL: 0.95                            # dt = CFL * dz / v_beam  (Balanced; Conservative 0.8)
  MAX_PART: 50000                      # downsample the gun snapshot (reweighted)
  MAX_STEPS: 0                         # 0 -> auto-derive from transit; >0 -> fixed
  N_DIAGS: 60
  TRANSIT_MARGIN: 0.98                 # stop just before the bunch centre reaches the exit
  HANDOFF_DZ: 0.008                    # [m] target dump spacing near the 2.03 m handoff
  Z_INJECT: 0.005                      # lab z of the bunch tail [m]
  RNG_SEED: 0
  PHASE: zc                            # "zc" = centroid on RF zero-crossing (pure bunching); "crest" = legacy
  # RF operating point (were in build_injector_field.py; pywarpx-free single source of truth).
  F_RF: 214184785.7142857              # 499.7645e6/42*18 = 18x master RF = 214.18 MHz
  Q_L_1: 3000                          # loaded Q of prebuncher 1
  Q_L_2: 4300                          # loaded Q of prebuncher 2
  PREB1_KW: 8.0
  PREB1_PHI_OFF: 0.0                   # [deg] from the zc base
  PREB2_KW: 10.0
  PREB2_PHI_OFF: 0.0
  PREB2_REVERSED: true
  PREB2_REV_PHASE: 3.141592653589793  # +pi reversed install (zc parametrization)
  I_LENS0A: 6.0
  I_LENS0B: 0.0
  I_LENS0C: 0.0
  I_LENS0D: 0.0
  I_SOL0: 40.0
  I_LENS0E: 10.0
  # The iris/pipe RADIUS is sourced once from sim.helpers.buildfields.RMAX (the SLAC bore = the
  # linac's physical scrape radius), so the injector report and the linac cut cannot diverge.
  COLLIM_Z: 1.922                      # [m] iris start
  COLLIMATE: true
