# Cornell Linac e+/e- converter target (G4beamline / Geant4). Reads the WarpX section-4 exit
# electron beam (the 4->5 boundary), drives it into a tungsten target, and writes the converted POSITRON beam as
# the standard openPMD handoff + injection_summary.json. sim/converter.py reads this back, resamples
# the incident e- core, writes a BLTrackFile, generates the .g4bl deck programmatically, runs the
# g4bl binary as a subprocess, and converts the BLTrackFile output via sim/helpers/g4bl.py.
# See docs/converter.md. (g4bl is an EXTERNAL binary -- G4beamline 3.08 -- not a pip/conda dep.)

# Target geometry (the physics: 6.35 mm tungsten, 10 mm radius solid cylinder, 1.81 X0 of W).
geometry:
  target_material: W            # Geant4 NIST tungsten (G4_W)
  target_length_mm: 6.35        # Fromowitz present thickness = 1.81 X0 (W X0 = 3.5 mm)
  target_radius_mm: 10.0        # 10 mm radius (20 mm diameter)
  target_front_z_mm: 0.0        # z of the target FRONT face [mm] in the g4bl frame
  front_clearance_mm: 2.0       # vacuum gap: incident-bunch head sits this far upstream of the face

# Precision / physics settings (the "precision settings" block).
physics:
  list: QGSP_BERT_EMZ           # Geant4 reference list; EMZ = EM Opt4 (best e+/e-/gamma models)
  min_range_cut_mm: 0.05        # production/range cut: secondaries below this range aren't created
  max_step_mm: 0.1              # max step INSIDE the target [mm] (resolves the brems/pair shower depth)
  n_events: 50000               # incident-electron events (the e- core is resampled up to this);
                                # `python sim/converter.py N` overrides this for a quick test
  rng_seed: 0                   # deterministic (g4bl also seeds its RNG per EventID)

# Capture solenoid: the real CONV_HV converter solenoid from the CLASSE BMAD deck
# (section_5_8_layout.bmad), tracked as a g4bl `fieldmap` of the committed con_sol extraction --
# the measured Br+Bz r-z grid (200x200 mm, 1 mm), normalized to on-axis peak 1, so the full
# Maxwellian field including the END FRINGE (the radial B_r that gives the lens action) is the
# deck's. The map's local origin is the target BACK face (the BMAD D_CONV start, where CONV_HV
# is centred): the field covers the target, peaks right at its back face, and dies out by
# +121 mm. `place ... current=b_tesla` sets the on-axis peak [T]. `enabled: false` reverts to
# the field-free run.
solenoid:
  enabled: true
  b_tesla: 0.7022              # on-axis peak [T] = the con_sol grid at the deck's 3300 A setpoint
                               # (the deck SHIPS the element at scale 1 -- off -- with 3300
                               # commented as the operating value). Fromowitz's 1.3 T
                               # infinite-solenoid upgrade value is the alternative.
  map: fieldmaps/g4bl/con_sol_fieldmap.txt
  map_span_mm: [-79.1, 120.9]  # grid z-extent rel. to the target back face (sample-plane guard)
  exit_drift_mm: 129.0         # target back face -> sampling plane [mm]. 129 = the BMAD D_CONV
                               # length, so the handoff plane IS the section-5 entrance flange;
                               # must exceed map_span end (120.9) so the handoff is field-free.

# Output sampling plane (a thin virtualdetector just past the target back face) + selection.
detector:
  back_clearance_mm: 3.0        # gap from the target back face to the sampling plane [mm]
                                # (solenoid-off runs only; else exit_drift_mm places the plane)
  radius_mm: 1000.0             # accept the full forward shower
  min_ke_mev: 1.0               # output KE threshold [MeV] (drop the soft shower debris)
  forward_only: true            # keep Pz > 0 tracks (drop backscatter toward the gun)
  keep_pdgid: -11               # species written to the handoff (positrons); e-/gamma are diagnostics

# g4bl executable (external binary; on PATH after the app-bundle MacOS dir was added to ~/.zshrc).
# If not found on PATH, sim/converter.py falls back to the standard macOS app-bundle location.
g4bl:
  exe: g4bl

# IO: read the WarpX linac1-4 sec4 exit (the 4->5 boundary); write the converter handoff. g4bl runs IN
# PLACE under workdir (deck + beam_in + sample land there); particles/ + summary go under outdir.
io:
  sec4_particles: logs/diags/linac1-4/sec4/main/particles
  sec4_summary:   logs/diags/linac1-4/sec4/main/injection_summary.json
  outdir:  logs/diags/converter/main
  workdir: logs/diags/converter
  deck_name:    converter.g4bl
  beam_in_file: beam_in.txt
  out_file:     sample.txt
