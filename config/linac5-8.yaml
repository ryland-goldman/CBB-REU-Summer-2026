# Cornell Linac sections 5-8 (Impact-T) -- lume-impact deck config. All constants live here;
# sim/linac5-8.py reads them back, builds the chained 4-section traveling-wave deck from the
# vendored rfdata4-7 field shapes, and runs ImpactTexe in-process via lume-impact. The shipped
# values ARE the single Balanced operating point. See docs/linac5-8.md for the physics.
#
# CALIBRATION IS FROZEN. The old stage ran an expensive per-section brentq field-scale fit + a
# crest-phase scan + §5 validation gates each run; that is dropped. The per-section field_scale
# and crest_phase_deg below were derived once (on-crest, scale-to-ΔE_target) and are hardcoded,
# applied directly to the deck (no search, no gates). See docs/linac5-8.md "Frozen calibration".

# RF / operating point (shared across all 4 sections).
rf:
  power_mw: 17.0                 # RF input power [MW] -- Fromowitz sec 5/6 forward power (capture sections)
  phase_deg: 0.0                 # nominal on-crest base phase (per-section crest is frozen below)
  rf_freq_hz: 2856.0e6           # S-band drive frequency [Hz]
  cell_length_m: 0.035           # S-band cell length d = 3.5 cm (sets beta0*d for the body scale)

# Lattice geometry.
lattice:
  first_section: 5               # machine section number of sections[0]; deck names derive from it
  bore_aperture_on: true         # solrf `radius` = real tapered bore (the binding aperture)

# The sec-5/6 capture solenoids TRACK the converter capture field: each section's
# solenoid_b_tesla below is its value at the converter reference field conv_b_ref (the CONV_HV
# 3300 A setpoint the 264 A string values are paired with), and the driver multiplies it by
# (converter solenoid.b_tesla / conv_b_ref) -- so retuning/scanning the converter capture field
# scales the whole capture line together. Converter block missing or disabled -> ratio 1.
solenoid_tracking:
  converter_config: config/converter.yaml
  conv_b_ref: 0.7022

# Beam / capture.
beam:
  species: positrons             # upstream is the converter positron beam (q=+e); sign flips Bcharge
  min_ke_mev: 2.0                # positron captured-core energy cut [MeV] (soft converter spectrum)
  np: 48000                      # macroparticles tracked in the final run. Richer core -> downsample to
                                 # this; sparser core -> smeared upsample to this if `upsample` (below).
                                 # Single-core Impact-T cost scales ~linearly in np and DOMINATES a
                                 # full-chain eval, so the CNSGA optimizer runs 48k (conservative: scalar
                                 # objective moments converge well below 120k) to fit the 47h50m cap.
  upsample: true                 # smeared-split the converter core up to `np` (SC is off, so each macro
                                 # is independent; preserves survival fraction + moments, raises sampling
                                 # density). Plain duplication would NOT help -- coincident clones track
                                 # identically. Set false to track only the genuine converter-core macros.
  upsample_smear: 0.2            # jitter as a fraction of each clone's k-NN phase-space distance
                                 # (local bandwidth); ~+2% emittance at 0.2. Raise for smoother, lower
                                 # for less phase-space blur.
  rng_seed: 0

# Impact-T deck knobs.
deck:
  ntstep: 200000                 # step cap (sized for the deck length at dt=3e-12; mean_z is asserted reached)
  dt: 3.0e-12                    # time step [s]
  nxyz: 16                       # Impact-T SC mesh per axis (power of 2; inert while SC is off)
  xyrad_m: 0.02                  # transverse computational-domain half-width [m] (box wall, not pipe)

# Per-section physics table (details.md), lab order sections 5..8. de15_mev is ΔE @ 15 MW (the
# √P reference); bore_in is the (entrance, exit) bore DIAMETER taper [inches] -> radii in code.
# field_scale [V/m] and crest_phase_deg are the per-section setpoints; field_scale is the
# √P-scaled seed (re-fit BY HAND when retuning -- NOT autophased), crest re-derived below.
# crest_phase_deg is re-derived automatically by sim/main.py (it runs `sim/autophase_impact.py`
# before this stage); the values here are the seed used when running the stage standalone. They are
# absolute Impact-T theta0 values that depend on the positron species (q=+e) AND the deck geometry
# (this deck starts at section 5; section 4 is now a WarpX stage upstream of the converter), so a
# standalone run on a changed upstream beam must be preceded by `sim/autophase_impact.py`.
#
# FOCUSING (the real CESR capture optics, from the CLASSE BMAD deck section_5_8_layout.bmad --
# kd324's 2021 linacsim working copy, ../Cornell/reference/classe-docs/nfs_acc_user_kd324_documents_mycesr_linacsim/BMAD/):
#   quad_scale = multiplier on this section's exit_optics quad gradients (below); 1.0 = the
#     machine CU setpoint (optimizer knob; autophase never touches it).
#   solenoid_b_tesla = capture-solenoid flat-top axial field [T] on sections 5 & 6 only (sec 7
#     is the first section without a solenoid). Scales the MEASURED string profile
#     (rfdata.pos_sol_profile -- the deck's pos_sol_A/B/C grids at their 264 A setpoint, flat-top
#     +0.2429 T, falling to ~30% of peak at the section flanges), whose element spans each cavity
#     PLUS its exit line, so the real fringe (and the
#     C trim coil at 5.18-5.27 m, in the exit line) keeps focusing across the inter-section gap.
sections:
  - {name: "CEA 4", length_m: 5.15, de15_mev: 55.0, bore_in: [1.16, 0.92], quad_scale: 1.0, solenoid_b_tesla: 0.243, field_scale: 2.654174e7, crest_phase_deg: 181.2413}   # sec 5
  - {name: "CEA 5", length_m: 5.15, de15_mev: 55.0, bore_in: [1.16, 0.92], quad_scale: 1.0, solenoid_b_tesla: 0.243, field_scale: 2.655278e7, crest_phase_deg: 155.5408}   # sec 6
  - {name: "CU 3",  length_m: 4.97, de15_mev: 51.0, bore_in: [1.16, 0.92], quad_scale: 1.0, solenoid_b_tesla: 0.0,   field_scale: 2.483940e7, crest_phase_deg: 326.9684}   # sec 7
  - {name: "CU 4",  length_m: 4.97, de15_mev: 51.0, bore_in: [1.16, 0.92], quad_scale: 1.0, solenoid_b_tesla: 0.0,   field_scale: 2.482722e7, crest_phase_deg: 287.5484}   # sec 8

# Real inter-section exit optics (same CLASSE BMAD deck): the drift/quad line AFTER each section's
# cavity, element lengths and order verbatim. Quad gradients [T/m] are the deck's CU overlay,
# grad = polarity * CU * (T/m per A) * (A per CU), at the machine setpoint (qh5=7, qv5=21,
# qh6=803, qv6=773, qh7=986, qv7=962, qh8=229, qv8=197 CU; 6 T/m per 10 A / 10 A per 1024 CU for
# Q5/Q8, 4.92 for Q6/Q7). Section 5's quads are ~0 (the 264 A capture solenoid focuses there);
# sections 6/7 are symmetric QH-QV-QH triplets; section 8's trailing doublet ends the modelled
# line (the positron snout continues from there). Drift lengths are the deck's flange-frame
# values; `grad` is multiplied by the section's quad_scale. pipe_radius_m records the deck's
# inter-section pipe radius (the quad-region value; the deck keeps 0.02 through D_FLAG_6/D_ACC7).
# It is set as the Impact-T element radius, which scrapes on quads only (drift radius is unused);
# the deck.xyrad_m 0.02 box wall remains the binding gap aperture.
exit_optics:
  sec5:
    pipe_radius_m: 0.02
    line:
      - {drift: 0.1054}                 # D_ACC5
      - {quad: 0.1829, grad: -0.0410}   # QH5 (7 CU)
      - {drift: 0.0457}                 # D_QH5
      - {quad: 0.1829, grad: 0.1230}    # QV5 (21 CU)
      - {drift: 0.1138}                 # D_QV5
  sec6:
    pipe_radius_m: 0.0254
    line:
      - {drift: 0.2991}                 # D_ACC6 + D_FLAG_6
      - {quad: 0.1219, grad: -3.8582}   # QH6_A (803 CU)
      - {drift: 0.0438}                 # D_QH6A
      - {quad: 0.2477, grad: 3.7140}    # QV6 (773 CU)
      - {drift: 0.0438}                 # D_QV6
      - {quad: 0.1219, grad: -3.8582}   # QH6_B
      - {drift: 0.1150}                 # D_QH6B
  sec7:
    pipe_radius_m: 0.0254
    line:
      - {drift: 0.1341}                 # D_ACC7
      - {quad: 0.1219, grad: -4.7374}   # QH7_A (986 CU)
      - {drift: 0.0438}                 # D_QH7A
      - {quad: 0.2477, grad: 4.6221}    # QV7 (962 CU)
      - {drift: 0.0438}                 # D_QV7
      - {quad: 0.1219, grad: -4.7374}   # QH7_B
      - {drift: 0.1016}                 # D_QH7B
  sec8:
    pipe_radius_m: 0.0254
    line:
      - {drift: 0.1695}                 # D_ACC8
      - {quad: 0.2223, grad: -1.3418}   # QH8 (229 CU)
      - {drift: 0.0851}                 # D_QH8
      - {quad: 0.2223, grad: 1.1543}    # QV8 (197 CU)

# Vendored S-band TW template field shapes (committed at fieldmaps/rfdata/). The 4-line solrf
# superposition reuses these verbatim: entrance rfdata4 (+0°), body_1 rfdata5 (+30°, /sin(beta0 d)),
# body_2 rfdata6 (+90°, /sin(beta0 d)), exit rfdata7 (+0°). table_power_mw is the √P reference.
rfdata:
  dir: fieldmaps/rfdata
  table_power_mw: 15.0
  # Measured capture-solenoid on-axis Bz (one sec5/6 string at 264 A) extracted from the CLASSE
  # pos_sol_A/B/C grids; z relative to the cavity start, spans [-1.5, 6.5] m. See the file header.
  pos_sol_profile: fieldmaps/rfdata/pos_sol_onaxis_264A.txt
  # Template coupler-cell lengths [m] (rfdata4/rfdata7 z-extent); body length per section is L-these.
  l_entrance: 0.052464
  l_exit: 0.05246

# Upstream input: the converter positron beam (produced after the WarpX section 4, q=+e core) and
# its local->lab z-chain summary. Output: the per-section / final beams + injection_summary.json.
io:
  conv_particles: logs/diags/converter/main/particles
  conv_summary: logs/diags/converter/main/injection_summary.json
  outdir: logs/diags/linac5-8/main
  workdir: logs/diags/linac5-8
